<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1230" media="(prefers-color-scheme: dark)">
<title>Rezerwacja – Kino Rzutnik</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><div class="wrap">
  <a class="brand" href="/"><img src="/logo.svg" alt="" width="30" height="30"><span class="brand-name">Rzutnik</span></a>
  <nav><a href="/">Repertuar</a></nav>
</div></header>
<main><div class="wrap">
<a class="back" id="back" href="/">Wróć do sali</a>
<div class="split">
  <div>
    <div class="seat-chip" id="chip">…</div>
    <h1 class="title" id="seat">Twój fotel</h1>
    <p class="lead" id="meta"></p>
  </div>
  <form class="panel" id="form" novalidate>
    <div class="field">
      <label for="name">Imię i nazwisko</label>
      <input id="name" name="customerName" autocomplete="name" required maxlength="100">
      <span class="hint">Podaj imię i nazwisko.</span>
    </div>
    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="254">
      <span class="hint">Podaj poprawny adres e-mail.</span>
    </div>
    <button class="btn" id="submit" type="submit">Zarezerwuj fotel</button>
    <div id="msg" class="hidden"></div>
  </form>
</div>
</div></main>
<footer class="site-footer"><div class="wrap">Kino Rzutnik. Płatności online pojawią się wkrótce, na razie bilet kupujesz po rezerwacji.</div></footer>
<script type="module" src="/js/reserve.js"></script>
</body>
</html>
