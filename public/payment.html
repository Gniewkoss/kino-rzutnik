<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1230" media="(prefers-color-scheme: dark)">
<title>Płatność w toku – Kino Rzutnik</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><div class="wrap">
  <a class="brand" href="/"><img src="/logo.svg" alt="" width="30" height="30"><span class="brand-name">Rzutnik</span></a>
  <nav><a href="/">Repertuar</a></nav>
</div></header>
<main><div class="wrap">
<a class="back" id="back" href="/">Wszystkie seanse</a>
<div class="split">
  <div>
    <div class="seat-chip" id="chip">…</div>
    <h1 class="title" id="title">Twój bilet</h1>
    <p class="lead" id="meta"></p>
  </div>
  <div class="panel" id="panel" style="view-transition-name: ticket">
    <div id="pending">
      <p class="pending-line"><span class="spinner" aria-hidden="true"></span><span>Płatność w toku…</span></p>
      <p class="small" id="pending-note">Czekamy na potwierdzenie od Stripe'a. Bilet pojawi się tu sam.</p>
    </div>
    <div id="msg" class="hidden" role="status"></div>
  </div>
</div>
</div></main>
<footer class="site-footer"><div class="wrap">Kino Rzutnik. Płatności kartą obsługuje Stripe w trybie testowym, pieniądze nie są pobierane.</div></footer>
<script type="module" src="/js/payment.js"></script>
</body>
</html>
