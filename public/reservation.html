<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1230" media="(prefers-color-scheme: dark)">
<title>Rezerwacja – Kino Rzutnik</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><div class="wrap">
  <a class="brand" href="/"><img src="/logo.svg" alt="" width="30" height="30"><span class="brand-name">Rzutnik</span></a>
  <nav><a href="/">Repertuar</a></nav>
</div></header>
<main><div class="wrap">
<a class="back" id="back" href="/">Wszystkie seanse</a>
<div class="split">
  <div>
    <div class="seat-chip" id="chip">…</div>
    <h1 class="title" id="title">Twoja rezerwacja</h1>
    <p class="lead" id="meta"></p>
  </div>
  <div class="panel" id="panel" style="view-transition-name: ticket">
    <div id="holding">
      <p class="small" style="margin:0">Trzymamy Twój fotel jeszcze</p>
      <div class="countdown" id="countdown" role="timer" aria-live="off">–:––</div>
      <div class="progress"><div id="bar" style="width:100%"></div></div>
      <button class="btn" id="buy" type="button">Kupuję bilet</button>
      <p class="small">Płatność online dojdzie wkrótce. Teraz bilet dostajesz od razu.</p>
    </div>
    <div id="msg" class="hidden" role="status"></div>
  </div>
</div>
</div></main>
<footer class="site-footer"><div class="wrap">Kino Rzutnik. Płatności online pojawią się wkrótce, na razie bilet kupujesz po rezerwacji.</div></footer>
<script type="module" src="/js/reservation.js"></script>
</body>
</html>
