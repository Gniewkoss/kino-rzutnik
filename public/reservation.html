<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twoja rezerwacja · Kino Rzutnik</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><div class="wrap">
  <a class="brand" href="/"><img src="/logo.svg" alt="" width="34" height="34"><span class="brand-name">Kino <span>Rzutnik</span></span></a>
  <nav>Repertuar</nav>
</div></header>
<main><div class="wrap">
<a class="back" id="back" href="/">← Repertuar</a>
<h1 id="title">Twoja rezerwacja</h1>
<p class="lead" id="meta"></p>
<div class="panel" id="panel">
  <div class="seat-badge">Fotel: <strong id="seat">…</strong></div>
  <div id="holding">
    <p class="countdown-label">Trzymamy Twój fotel jeszcze</p>
    <div class="countdown" id="countdown">--:--</div>
    <div class="bar"><div id="bar" style="width:100%"></div></div>
    <button class="btn" id="buy" type="button">Kupuję bilet</button>
  </div>
  <div id="msg" class="hidden"></div>
</div>
</div></main>
<footer class="site-footer"><div class="wrap">Kino Rzutnik · kasa biletowa · płatności online wkrótce</div></footer>
<script type="module" src="/js/reservation.js"></script>
</body>
</html>
